<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 AI 入口小图标 · 视觉预览</title>
<style>
  /* ===== 复刻首页环境（取自 Home.vue） ===== */
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .fake-navbar {
    height: 64px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    padding: 0 40px;
    font-size: 20px;
    font-weight: bold;
  }
  .fake-navbar span {
    background: linear-gradient(45deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .fake-cards {
    max-width: 1200px;
    margin: 40px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 24px;
    padding: 0 20px;
  }
  .fake-card {
    background: #fff;
    border-radius: 16px;
    height: 140px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 14px;
  }

  /* ===== 以下与 src/components/AiMascotEntry.vue 保持一致 ===== */
  .ai-mascot-entry {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 1200;
  }
  .mascot-float {
    animation: mascot-bob 3.4s ease-in-out infinite;
  }
  .mascot-hover {
    position: relative;
    width: 84px;
    height: 84px;
    transition: transform 0.25s ease;
  }
  .mascot-hover:hover {
    transform: scale(1.08);
  }
  .mascot-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #409eff,
      #667eea,
      #13c2c2,
      #ff6b6b,
      #ffa500,
      #409eff
    );
    box-shadow: 0 0 16px 2px rgba(102, 126, 234, 0.45);
    animation: mascot-ring-spin 4.5s linear infinite;
  }
  .mascot-fab {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 6px 18px rgba(31, 41, 55, 0.18);
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow 0.25s ease;
  }
  .mascot-hover:hover .mascot-fab {
    box-shadow: 0 10px 26px rgba(31, 41, 55, 0.26);
  }
  .mascot-fab:active {
    transform: scale(0.97);
  }
  .mascot-fab:focus-visible {
    outline: 2px solid #409eff;
    outline-offset: 4px;
  }
  .mascot-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  @keyframes mascot-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes mascot-ring-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @media (max-width: 640px) {
    .ai-mascot-entry { right: 16px; bottom: 16px; }
    .mascot-hover { width: 64px; height: 64px; }
    .mascot-ring { inset: -4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot-float,
    .mascot-ring { animation: none; }
    .mascot-hover { transition: none; }
  }
</style>
</head>
<body>
  <div class="fake-navbar"><span>智能学习平台</span></div>
  <div class="fake-cards">
    <div class="fake-card">快捷功能卡片（示意）</div>
    <div class="fake-card">快捷功能卡片（示意）</div>
    <div class="fake-card">快捷功能卡片（示意）</div>
    <div class="fake-card">快捷功能卡片（示意）</div>
  </div>

  <!-- 与组件一致的标记；视频用相对路径指向 public 资源 -->
  <div class="ai-mascot-entry">
    <div class="mascot-float">
      <div class="mascot-hover">
        <span class="mascot-ring"></span>
        <button type="button" class="mascot-fab" aria-label="进入 AI 面试官">
          <video class="mascot-video" src="../frontend/public/pets/naifrog/flag.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
