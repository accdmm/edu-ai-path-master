# 百炼（阿里云 DashScope）配置 - 全部 AI 能力统一走百炼（用户提供 key）
# 聊天/出卷/判卷/面试/客服：kimi-k3（百炼上的模型）；向量：qwen3.7-text-embedding-flash（免费）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  chat-model: kimi-k3
  embedding-model: qwen3.7-text-embedding-flash

# Pinecone 向量数据库配置 - AI 客服 RAG 检索
pinecone:
  api-key: ${PINECONE_API_KEY:}
  index: edu-ai-index
  namespace: edu-namespace
  cloud: AWS
  region: us-east-1

# 支付宝开放平台配置（沙箱环境）
